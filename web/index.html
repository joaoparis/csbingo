<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="csbingo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>csbingo</title>
  <link rel="manifest" href="manifest.json">
</head>
<style>
  body {
    background: #000;
    margin: 0;
    padding: 0;
  }
  #splash {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  @font-face {
    font-family: 'HighSpeed';
    src: url('assets/fonts/HighSpeed.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  #splash-text {
    color: #fff;
    font-family: 'HighSpeed', sans-serif;
    font-size: 2.5rem;
    letter-spacing: 0.1em;
    text-align: center;
    text-shadow: 0 2px 8px #000a;
  }
</style>
</head>
<body>
  <div id="splash">
    <div id="splash-text">LOADING…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash');
      if (splash) splash.style.display = 'none';
    });
  </script>
  <script async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3606445852359484"
  crossorigin="anonymous"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
